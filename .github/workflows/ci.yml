name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/monitoring-ui-api/package-lock.json

      - name: Install .NET SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir .dotnet

      - name: Install UI dependencies
        run: npm ci --prefix src/monitoring-ui-api

      - name: Validate Node syntax and config
        run: |
          node --check src/monitoring-ui-api/server.mjs
          node --check src/monitoring-ui-api/public/app.js
          BROWSER_EXECUTABLE_PATH=/usr/bin/google-chrome npm --prefix src/monitoring-ui-api test

      - name: Build .NET services
        run: |
          ./scripts/dotnet build src/cmdbwebhooks2kafka/cmdbwebhooks2kafka.csproj -v minimal
          ./scripts/dotnet build src/cmdbkafka2zabbix/cmdbkafka2zabbix.csproj -v minimal
          ./scripts/dotnet build src/zabbixrequests2api/zabbixrequests2api.csproj -v minimal
          ./scripts/dotnet build src/zabbixbindings2cmdbuild/zabbixbindings2cmdbuild.csproj -v minimal
          ./scripts/dotnet build tests/configvalidation/configvalidation.csproj -v minimal

      - name: Run repository validation
        run: ./scripts/test-configs.sh

      - name: Validate production runtime contract
        run: ./scripts/validate-production-runtime.sh

      - name: Validate production Compose contracts
        run: |
          docker compose --env-file deploy/production.env.example -f deploy/compose.production.yml config -q
          SYSLOG_ADDRESS=udp://127.0.0.1:514 docker compose --env-file deploy/production.env.example -f deploy/compose.production.yml -f deploy/compose.logging-syslog.yml config -q

      - name: Validate observability contract
        run: ./scripts/validate-observability.sh

      - name: Check whitespace
        run: git diff --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
