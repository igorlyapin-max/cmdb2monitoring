services:
  cmdbkafka2zabbix:
    image: ${RULES_ARTIFACT_CONVERTER_IMAGE:?set RULES_ARTIFACT_CONVERTER_IMAGE}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Service__RulesReloadToken: ${RULES_ARTIFACT_TOKEN:?set RULES_ARTIFACT_TOKEN}
      Service__RulesStatusToken: ${RULES_ARTIFACT_TOKEN:?set RULES_ARTIFACT_TOKEN}
      ConversionRules__BaseDirectory: /app
      ConversionRules__RepositoryPath: /app
      ConversionRules__RulesFilePath: rules/cmdbuild-to-zabbix-host-create.json
      ConversionRules__ReadFromGit: "false"
      Kafka__Input__BootstrapServers: kafka:1
      Kafka__Input__SecurityProtocol: Plaintext
      Kafka__Input__AllowPlaintextKafka: "true"
      Kafka__Output__BootstrapServers: kafka:1
      Kafka__Output__SecurityProtocol: Plaintext
      Kafka__Output__AllowPlaintextKafka: "true"
      ElkLogging__Enabled: "false"
    volumes:
      - ${RULES_ARTIFACT_RULES_HOST_PATH:?set RULES_ARTIFACT_RULES_HOST_PATH}:/app/rules:ro

  monitoring-ui-api:
    image: ${RULES_ARTIFACT_UI_IMAGE:?set RULES_ARTIFACT_UI_IMAGE}
    environment:
      NODE_ENV: Development
      MONITORING_UI_HOST: 127.0.0.1
      PORT: "5090"
      RULES_ACTIVE_BASE_DIRECTORY: /app
      RULES_ACTIVE_FILE_PATH: rules/cmdbuild-to-zabbix-host-create.json
      RULES_ACTIVE_WRITE_ENABLED: "true"
      MONITORING_UI_EVENTS_ENABLED: "false"
      MONITORING_UI_LOGS_ENABLED: "false"
      MONITORING_UI_HEALTH_ENDPOINTS_JSON: >-
        [{"Name":"cmdbkafka2zabbix","Url":"http://cmdbkafka2zabbix:8080/health","RulesReloadUrl":"http://cmdbkafka2zabbix:8080/admin/reload-rules","RulesReloadToken":"${RULES_ARTIFACT_TOKEN:?set RULES_ARTIFACT_TOKEN}","RulesStatusUrl":"http://cmdbkafka2zabbix:8080/admin/rules-status","RulesStatusToken":"${RULES_ARTIFACT_TOKEN:?set RULES_ARTIFACT_TOKEN}"}]
    depends_on:
      cmdbkafka2zabbix:
        condition: service_started
    volumes:
      - ${RULES_ARTIFACT_RULES_HOST_PATH:?set RULES_ARTIFACT_RULES_HOST_PATH}:/app/rules:rw
