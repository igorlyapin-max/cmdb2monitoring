stages:
  - validate
  - build
  - test
  - security

variables:
  DOTNET_ROOT: "$CI_PROJECT_DIR/.dotnet"
  DOTNET_CLI_HOME: "$CI_PROJECT_DIR/.dotnet_home"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .dotnet/
    - .nuget/packages/
    - .npm/
    - src/monitoring-ui-api/node_modules/

.node_job:
  image: node:22-bookworm

.install_dotnet: &install_dotnet
  - apt-get update
  - apt-get install -y --no-install-recommends ca-certificates curl
  - test -x .dotnet/dotnet || curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
  - test -x .dotnet/dotnet || bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir .dotnet

node_config:
  extends: .node_job
  stage: validate
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
  script:
    - npm ci --prefix src/monitoring-ui-api
    - node --check src/monitoring-ui-api/server.mjs
    - node --check src/monitoring-ui-api/public/app.js
    - BROWSER_EXECUTABLE_PATH=/usr/bin/chromium npm --prefix src/monitoring-ui-api test

production_compose_contract:
  image: docker:27-cli
  stage: validate
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  script:
    - docker compose --env-file deploy/production.env.example -f deploy/compose.production.yml config -q
    - SYSLOG_ADDRESS=udp://127.0.0.1:514 docker compose --env-file deploy/production.env.example -f deploy/compose.production.yml -f deploy/compose.logging-syslog.yml config -q

whitespace:
  extends: .node_job
  stage: validate
  script:
    - git diff --check

dotnet_build:
  extends: .node_job
  stage: build
  before_script: *install_dotnet
  script:
    - ./scripts/dotnet build src/cmdbwebhooks2kafka/cmdbwebhooks2kafka.csproj -v minimal
    - ./scripts/dotnet build src/cmdbkafka2zabbix/cmdbkafka2zabbix.csproj -v minimal
    - ./scripts/dotnet build src/zabbixrequests2api/zabbixrequests2api.csproj -v minimal
    - ./scripts/dotnet build src/zabbixbindings2cmdbuild/zabbixbindings2cmdbuild.csproj -v minimal
    - ./scripts/dotnet build tests/configvalidation/configvalidation.csproj -v minimal

gkm_runtime_delivery:
  image: docker:27-cli
  stage: build
  services:
    - name: docker:27-dind
  rules:
    - if: '$GKM_RUNTIME_DELIVERY_ENABLED == "true"'
    - when: never
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - apk add --no-cache bash
  script:
    - test -n "$GKM_REGISTRY"
    - test -n "$GKM_NODE_RUNTIME_IMAGE"
    - test -n "$GKM_DOTNET_SDK_IMAGE"
    - test -n "$GKM_DOTNET_RUNTIME_IMAGE"
    - >-
      REGISTRY="$GKM_REGISTRY"
      NAMESPACE="${GKM_NAMESPACE:-cmdb2monitoring}"
      PUSH=true
      DELIVERY_MODE=canonical
      NODE_RUNTIME_IMAGE="$GKM_NODE_RUNTIME_IMAGE"
      DOTNET_SDK_IMAGE="$GKM_DOTNET_SDK_IMAGE"
      DOTNET_RUNTIME_IMAGE="$GKM_DOTNET_RUNTIME_IMAGE"
      ./scripts/build-local-registry-images.sh

repository_validation:
  extends: .node_job
  stage: test
  before_script: *install_dotnet
  script:
    - npm ci --prefix src/monitoring-ui-api
    - ./scripts/test-configs.sh
    - ./scripts/validate-production-runtime.sh
    - ./scripts/validate-observability.sh

monitoring_ui_container_smoke:
  image: docker:27-cli
  stage: test
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - apk add --no-cache bash
  script:
    - ./scripts/smoke-monitoring-ui-image.sh

secret_scan:
  image:
    name: zricethezav/gitleaks:v8.27.2
    entrypoint:
      - ""
  stage: security
  script:
    - gitleaks detect --source . --redact --verbose
