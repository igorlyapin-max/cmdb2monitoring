openapi: 3.0.3
info:
  title: cmdb2monitoring Health API
  version: 0.4.0
servers:
  - url: http://localhost:5080
    description: cmdbwebhooks2kafka dev
  - url: http://192.168.202.35:5080
    description: cmdbwebhooks2kafka dev from CMDBuild Docker container
  - url: http://localhost:5081
    description: cmdbkafka2zabbix dev
  - url: http://localhost:5082
    description: zabbixrequests2api dev
  - url: http://localhost:5083
    description: zabbixbindings2cmdbuild dev
  - url: http://localhost:5090
    description: monitoring-ui-api dev
paths:
  /health:
    get:
      summary: Service health check
      operationId: getServiceHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service:
                    type: string
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      summary: Service readiness check
      operationId: getServiceReadiness
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /admin/reload-rules:
    post:
      summary: Reload cmdbkafka2zabbix conversion rules
      description: >
        Available on cmdbkafka2zabbix. The endpoint calls the configured
        conversion rules provider; the current Git provider may run
        git pull --ff-only when ConversionRules:PullOnReload is enabled.
      security:
        - reloadBearer: []
      responses:
        '200':
          description: Conversion rules were reloaded.
          content:
            application/json:
              schema:
                type: object
                required: [service, status, rules]
                properties:
                  service:
                    type: string
                  status:
                    type: string
                    example: ok
                  rules:
                    type: object
                    additionalProperties: true
        '401':
          description: Missing or invalid bearer token.
        '503':
          description: Reload token is not configured.
components:
  schemas:
    ReadinessResponse:
      type: object
      required: [service, status, startedAt, checkedAt, checks]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ready, not_ready]
        ready:
          type: boolean
        startedAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
        checks:
          type: array
          items:
            type: object
            required: [name, status, message]
            properties:
              name:
                type: string
              status:
                type: string
                enum: [ready, not_ready]
              message:
                type: string
  securitySchemes:
    reloadBearer:
      type: http
      scheme: bearer
